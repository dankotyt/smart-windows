spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/users_db
    username: ${USER_DB_LOGIN}
    password: ${USER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    database: postgresql

jwt:
  secret: ${JWT_SECRET}
  access-ttl: ${JWT_ACCESS_TTL}
  refresh-ttl: ${JWT_REFRESH_TTL}

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    ru.pin36bik: DEBUG

#server:
#  port: 8082

window:
  service:
    url: http://window-management-service:8080 #8083
